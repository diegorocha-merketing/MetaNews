name: Actualizar contenido diario

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  actualizar-contenido:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generar contenido.json nuevo
        run: python3 actualizar.py

      - name: Subir cambios si hay contenido nuevo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add contenido.json
          git diff --staged --quiet || git commit -m "Actualizacion automatica de contenido"
          git push
